name: Example implementations

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            tests/interop/package-lock.json
            servers/cloudflare-worker/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: servers/go/go.mod
          cache-dependency-path: servers/go/go.sum
      - run: make install
      - run: make check test build
      - run: npx playwright install --with-deps chromium
        working-directory: tests/interop
      - run: make test-interop
      - run: make test-worker-browser
